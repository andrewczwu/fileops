# Release: push a tag like v1.2.3 and this builds, verifies, attests and publishes the artefacts.
# The version is taken from the tag; the build fails if CHANGELOG.md has no matching section.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CI: "true"

jobs:
  build:
    name: Build release artefacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Releases build in an exact, immutable toolchain image (digest from the build-image job summary).
      image: ghcr.io/andrewczwu/fileops-build:main@sha256:108ca2e8f23bb0fe911d5f7558b552fc8b7a1fd2487282f17c8fb05c05ed2069
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 1001:1001
    env:
      DOTNET_CLI_HOME: /tmp/dotnet-home
      RID: linux-x64
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Derive version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/ci/version-from-tag.sh "$TAG" >> "$GITHUB_OUTPUT"
      # Deliberately no package cache here: release builds restore from scratch so a poisoned
      # cache entry from a pull request can never reach a published artefact.
      - name: Test
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FILEOPS_TEST_LOG_DIR: artifacts/logs
        run: make test
      - name: Publish and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          make publish
          FILEOPS_BIN="$PWD/artifacts/publish/linux-x64/fileops" FILEOPS_TEST_LOG_DIR=artifacts/logs-native \
            dotnet test tests/FileOps.Integration.Tests -c Release --no-restore
          make package
          scripts/lint-deb.sh
          tar -C artifacts/publish/linux-x64 -czf "artifacts/deb/fileops_${VERSION}_linux-x64.tar.gz" fileops
          (cd artifacts/deb && sha256sum ./*.deb ./*.tar.gz > SHA256SUMS && cat SHA256SUMS)
      - name: Artefact summary
        run: scripts/ci/artifact-summary.sh >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: artifacts/deb
          if-no-files-found: error

  verify:
    name: Verify on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: [debian:bookworm-slim, debian:trixie-slim, ubuntu:22.04, ubuntu:24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: artifacts/deb
      - name: Install smoke test
        env:
          SMOKE_IMAGES: ${{ matrix.image }}
        run: scripts/smoke-test.sh

  publish:
    name: Publish GitHub release
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: artifacts/deb
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            artifacts/deb/*.deb
            artifacts/deb/*.tar.gz
      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: scripts/ci/changelog-section.sh "$VERSION" > artifacts/release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        # --generate-notes appends the merged-PR list below the CHANGELOG section.
        run: |
          gh release create "$TAG" \
            --title "fileops $VERSION" \
            --notes-file artifacts/release-notes.md \
            --generate-notes \
            --verify-tag \
            artifacts/deb/*.deb artifacts/deb/*.tar.gz artifacts/deb/SHA256SUMS
