# nfpm (https://nfpm.goreleaser.com) package definition.
# VERSION (Debian-formatted) and ARCH are supplied by scripts/package.sh, which also stages every
# file under artifacts/stage/ (nfpm expands ${VAR} in top-level fields only, not in content paths).
name: fileops
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Andrew Wu <andrewczwu@gmail.com>
vendor: Andrew Wu
homepage: https://github.com/andrewczwu/fileops
license: MIT
description: |
  Command-line tool for creating, copying, combining and deleting files.
  Writes are atomic (temp file + rename), destinations are never overwritten
  without --force, exit codes are stable, and every run can emit structured
  JSON logs, OpenTelemetry traces and metrics. Ships as a single native
  executable with no runtime dependencies beyond glibc.

contents:
  - src: artifacts/stage/fileops
    dst: /usr/bin/fileops
    file_info:
      mode: 0755
  - src: artifacts/stage/fileops.1.gz
    dst: /usr/share/man/man1/fileops.1.gz
    file_info:
      mode: 0644
  - src: packaging/copyright
    dst: /usr/share/doc/fileops/copyright
    file_info:
      mode: 0644
  - src: artifacts/stage/changelog.gz
    dst: /usr/share/doc/fileops/changelog.gz
    file_info:
      mode: 0644
  - src: packaging/lintian-overrides
    dst: /usr/share/lintian/overrides/fileops
    file_info:
      mode: 0644

deb:
  fields:
    Bugs: https://github.com/andrewczwu/fileops/issues
